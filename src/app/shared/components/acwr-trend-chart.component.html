<div *ngIf="hasData(); else empty" class="space-y-2">
  <!-- Valeur actuelle mise en avant, pour une lecture immédiate -->
  <div *ngIf="lastValid() as last" class="flex items-baseline gap-2">
    <span class="text-2xl font-mono font-bold text-chalk">{{ last.ratio | number: '1.1-1' }}</span>
    <span class="text-xs font-display tracking-wide" [style.color]="colorFor(last.zone)">
      {{ labelFor(last.zone) }}
    </span>
  </div>

  <!-- Graphique : bandes de zones + courbe -->
  <svg [attr.viewBox]="viewBox" class="w-full h-auto" preserveAspectRatio="none">
    <!-- Bandes de couleur (zones de risque) -->
    <rect
      *ngFor="let band of bands"
      x="0"
      [attr.y]="band.y"
      [attr.width]="width"
      [attr.height]="band.height"
      [attr.fill]="band.color"
      [attr.opacity]="band.opacity"
    />

    <!-- Lignes de seuil (0.8, 1.3, 1.5) -->
    <line *ngFor="let t of [0.8, 1.3, 1.5]"
      x1="0" [attr.x2]="width"
      [attr.y1]="height - 6 - (t / 2.0) * (height - 12)"
      [attr.y2]="height - 6 - (t / 2.0) * (height - 12)"
      stroke="currentColor" class="text-steel/20" stroke-width="1" stroke-dasharray="3 3"
    />

    <!-- Courbe d'évolution -->
    <polyline
      [attr.points]="polylinePoints()"
      fill="none"
      stroke="#F5F5F0"
      stroke-width="2"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Point final -->
    <circle *ngIf="lastPointCoords() as pt" [attr.cx]="pt.x" [attr.cy]="pt.y" r="3.5" [attr.fill]="lastValid() ? colorFor(lastValid()!.zone) : '#F5F5F0'" />
  </svg>

  <!-- Légende des zones -->
  <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] text-steel">
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:#3E7CB1"></span> Sous-charge (&lt;0.8)</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:#4C9A6A"></span> Optimale (0.8–1.3)</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:#E8B93B"></span> À surveiller (1.3–1.5)</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:#E5484D"></span> Risque élevé (&gt;1.5)</span>
  </div>
</div>

<ng-template #empty>
  <p class="text-xs text-steel py-4 text-center">{{ emptyLabel }}</p>
</ng-template>
