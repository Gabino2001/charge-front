<div class="min-h-screen flex items-center justify-center bg-ink px-4">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-2 mb-8">
      <span class="text-3xl font-display font-semibold text-chalk">
        CHARGE<span class="text-plate-red">.</span>
      </span>
    </div>

    <div *ngIf="!done()" class="bg-surface border border-border rounded-xl p-6 space-y-4">
      <h1 class="text-lg font-display text-chalk mb-2">Nouveau mot de passe</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="text-xs uppercase tracking-wide text-steel font-display">Nouveau mot de passe</label>
          <input
            type="password"
            formControlName="newPassword"
            class="w-full mt-1 px-3 py-2 rounded-md text-sm bg-surface-alt border border-border text-chalk outline-none focus:border-plate-blue"
            placeholder="8 caractères minimum"
          />
        </div>

        <div>
          <label class="text-xs uppercase tracking-wide text-steel font-display">Confirmer le mot de passe</label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="w-full mt-1 px-3 py-2 rounded-md text-sm bg-surface-alt border border-border text-chalk outline-none focus:border-plate-blue"
          />
        </div>

        <p *ngIf="errorMessage()" class="text-xs text-plate-red">{{ errorMessage() }}</p>

        <button
          type="submit"
          [disabled]="form.invalid || loading()"
          class="w-full py-2.5 rounded-md text-sm font-display tracking-wide bg-plate-red text-chalk disabled:opacity-40"
        >
          {{ loading() ? 'MISE À JOUR…' : 'METTRE À JOUR LE MOT DE PASSE' }}
        </button>
      </form>

      <p class="text-xs text-center text-steel">
        <a routerLink="/login" class="text-plate-blue">← Retour à la connexion</a>
      </p>
    </div>

    <div *ngIf="done()" class="bg-surface border border-plate-green/40 rounded-xl p-6 text-center space-y-3">
      <div class="w-10 h-10 mx-auto rounded-full bg-plate-green/20 flex items-center justify-center">
        <span class="text-plate-green text-lg">✓</span>
      </div>
      <h1 class="text-lg font-display text-chalk">Mot de passe mis à jour</h1>
      <p class="text-xs text-steel leading-relaxed">Tu peux maintenant te connecter avec ton nouveau mot de passe.</p>
      <button
        (click)="goToLogin()"
        class="mt-2 px-5 py-2.5 rounded-full bg-plate-red text-chalk text-sm font-display tracking-wide hover:brightness-110 transition"
      >
        SE CONNECTER
      </button>
    </div>
  </div>
</div>
