<div class="min-h-screen bg-ink">
  <header class="flex items-center gap-3 px-4 md:px-8 py-4 border-b border-border">
    <button (click)="goBack()" class="text-xs text-steel font-display tracking-wide">← RETOUR</button>
    <span class="text-xl font-display font-semibold text-chalk ml-auto">
      CHARGE<span class="text-plate-red">.</span>
    </span>
  </header>

  <div class="max-w-sm mx-auto px-4 py-10">
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="bg-surface border border-border rounded-xl p-6 space-y-4"
    >
      <h1 class="text-lg font-display text-chalk mb-2">Changer mon mot de passe</h1>

      <div>
        <label class="text-xs uppercase tracking-wide text-steel font-display">Mot de passe actuel</label>
        <input
          type="password"
          formControlName="currentPassword"
          class="w-full mt-1 px-3 py-2 rounded-md text-sm bg-surface-alt border border-border text-chalk outline-none focus:border-plate-blue"
        />
      </div>

      <div>
        <label class="text-xs uppercase tracking-wide text-steel font-display">Nouveau mot de passe</label>
        <input
          type="password"
          formControlName="newPassword"
          class="w-full mt-1 px-3 py-2 rounded-md text-sm bg-surface-alt border border-border text-chalk outline-none focus:border-plate-blue"
          placeholder="8 caractères minimum"
        />
      </div>

      <div>
        <label class="text-xs uppercase tracking-wide text-steel font-display">Confirmer le nouveau mot de passe</label>
        <input
          type="password"
          formControlName="confirmPassword"
          class="w-full mt-1 px-3 py-2 rounded-md text-sm bg-surface-alt border border-border text-chalk outline-none focus:border-plate-blue"
        />
      </div>

      <p *ngIf="errorMessage()" class="text-xs text-plate-red">{{ errorMessage() }}</p>

      <button
        type="submit"
        [disabled]="form.invalid || saving()"
        class="w-full py-2.5 rounded-md text-sm font-display tracking-wide bg-plate-red text-chalk disabled:opacity-40"
      >
        {{ saving() ? 'MISE À JOUR…' : 'METTRE À JOUR' }}
      </button>
    </form>
  </div>
</div>
